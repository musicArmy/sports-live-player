<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sports Streamer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 0;
      border-bottom: 2px solid #00d4ff;
    }

    header h1 {
      font-size: 2.5rem;
      color: #00d4ff;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    header p {
      color: #aaa;
      font-size: 0.95rem;
    }

    .sync-status {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(0, 255, 100, 0.1);
      border: 1px solid #00ff64;
      color: #00ff64;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .sync-status.syncing {
      background: rgba(255, 180, 0, 0.1);
      border-color: #ffb400;
      color: #ffb400;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid #00d4ff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 2rem;
      color: #00d4ff;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #00d4ff;
      color: #000;
    }

    .btn-primary:hover {
      background: #00a8cc;
      transform: scale(1.05);
    }

    .btn-secondary {
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
      border: 1px solid #00d4ff;
    }

    .btn-secondary:hover {
      background: rgba(0, 212, 255, 0.3);
    }

    .search-box {
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #00d4ff;
      background: rgba(0, 212, 255, 0.1);
      color: #fff;
      border-radius: 5px;
      font-size: 1rem;
    }

    .search-box input::placeholder {
      color: #888;
    }

    .search-box input:focus {
      outline: none;
      background: rgba(0, 212, 255, 0.2);
    }

    .filter-chips {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 16px;
      border: 1px solid #00d4ff;
      background: transparent;
      color: #00d4ff;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .chip:hover, .chip.active {
      background: #00d4ff;
      color: #000;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .match-card {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .match-card:hover, .match-card:active {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
    }

    .match-card.selected {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .match-title {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #00d4ff;
    }

    .match-info {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 10px;
    }

    .match-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 0.75rem;
      background: rgba(0, 212, 255, 0.2);
      border: 1px solid #00d4ff;
    }

    .badge.live {
      background: rgba(0, 255, 100, 0.2);
      border-color: #00ff64;
      color: #00ff64;
    }

    .badge.upcoming {
      background: rgba(255, 180, 0, 0.2);
      border-color: #ffb400;
      color: #ffb400;
    }

    .match-viewers {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 12px;
    }

    .watch-btn {
      width: 100%;
      padding: 10px;
      background: #00d4ff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .watch-btn:hover, .watch-btn:active {
      background: #00a8cc;
    }

    .player-section {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid #00d4ff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .player-section h2 {
      color: #00d4ff;
      margin-bottom: 15px;
    }

    .video-container {
      width: 100%;
      height: 500px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .video-container.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }

    .quality-selector {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .quality-selector h3 {
      color: #00d4ff;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .quality-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quality-btn {
      padding: 8px 12px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid #00d4ff;
      color: #00d4ff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .quality-btn:hover, .quality-btn.active {
      background: #00d4ff;
      color: #000;
    }

    .source-list {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .source-list h3 {
      color: #00d4ff;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .source-items {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .source-btn {
      padding: 8px 12px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid #00d4ff;
      color: #00d4ff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .source-btn:hover, .source-btn.active {
      background: #00d4ff;
      color: #000;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 212, 255, 0.2);
      border-top: 4px solid #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff0000;
      color: #ff6b6b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      .video-container {
        height: 300px;
      }

      .matches-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Live Sports Stream</h1>
      <p>Auto-synced from dillzycreations/All-Sports-</p>
      <div class="sync-status" id="syncStatus">✓ Connected</div>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Matches</div>
        <div class="value" id="totalMatches">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Live Now</div>
        <div class="value" id="liveMatches">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Upcoming</div>
        <div class="value" id="upcomingMatches">0</div>
      </div>
    </div>

    <div class="player-section">
      <h2>Now Playing</h2>
      <div class="video-container empty" id="videoContainer">
        <div>Select a match to start streaming</div>
      </div>

      <div class="quality-selector" id="qualitySelector" style="display:none;">
        <h3>Video Quality</h3>
        <div class="quality-buttons" id="qualityButtons"></div>
      </div>

      <div class="source-list" id="sourceList" style="display:none;">
        <h3>Available Sources</h3>
        <div class="source-items" id="sourceItems"></div>
      </div>

      <div>
        <button class="btn btn-primary" id="playBtn" style="width:100%;padding:12px;">▶ Play Selected Match</button>
      </div>
    </div>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search matches...">
      </div>
      <button class="btn btn-secondary" id="refreshBtn">🔄 Force Refresh</button>
    </div>

    <div class="filter-chips">
      <button class="chip active" data-filter="all">All Matches</button>
      <button class="chip" data-filter="live">Live</button>
      <button class="chip" data-filter="upcoming">Upcoming</button>
    </div>

    <div id="errorContainer"></div>

    <div id="matchesContainer" class="matches-grid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading matches...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
  <script>
    const app = {
      matches: [],
      selectedMatch: null,
      selectedSourceIndex: 0,
      selectedQuality: 'auto',
      filter: 'all',
      search: '',
      hls: null,
      videoPlayer: null,
      lastSyncHash: null,
      syncInterval: 2000, // 2 seconds for real-time sync

      async init() {
        this.videoPlayer = this.createVideoPlayer();
        this.bindEvents();
        await this.loadMatches();
        this.startRealTimeSync();
      },

      createVideoPlayer() {
        const container = document.getElementById('videoContainer');
        container.classList.remove('empty');
        container.innerHTML = '<video controls playsinline style="width:100%;height:100%;" controlsList="nodownload"></video>';
        return container.querySelector('video');
      },

      bindEvents() {
        document.querySelectorAll('[data-filter]').forEach(chip => {
          chip.addEventListener('click', (e) => {
            document.querySelectorAll('[data-filter]').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            this.filter = e.target.dataset.filter;
            this.render();
          });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
          this.search = e.target.value.toLowerCase();
          this.render();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => this.loadMatches());
        document.getElementById('playBtn').addEventListener('click', () => this.playSelected());
      },

      async loadMatches() {
        try {
          const response = await fetch('https://raw.githubusercontent.com/dillzycreations/All-Sports-/main/data/matches.json?t=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache' }
          });

          if (!response.ok) throw new Error('Failed to fetch');

          const data = await response.json();
          const newHash = JSON.stringify(data).substring(0, 50);

          // Check if data actually changed
          if (this.lastSyncHash !== newHash) {
            this.lastSyncHash = newHash;
            
            this.matches = (data.matches || []).map(m => ({
              ...m,
              status: (m.status || 'upcoming').toLowerCase(),
              viewers: m.viewers || '0',
              league: m.league || 'General',
              sport: m.sport || 'sport',
              title: m.title || 'Untitled',
              teams: m.teams || m.title || 'Teams'
            }));

            this.updateStats();
            this.render();
            this.clearError();
            this.updateSyncStatus('Connected');

            // Auto-select first live match if none selected
            if (!this.selectedMatch && this.matches.length > 0) {
              const liveMatch = this.matches.find(m => m.status === 'live');
              this.selectMatch(liveMatch || this.matches[0]);
            }
          }
        } catch (error) {
          console.error('Error loading matches:', error);
          this.updateSyncStatus('Reconnecting...', true);
          this.showError('Failed to sync. Retrying in 2 seconds...');
        }
      },

      updateSyncStatus(text, isSyncing = false) {
        const status = document.getElementById('syncStatus');
        status.textContent = text;
        status.classList.toggle('syncing', isSyncing);
      },

      updateStats() {
        document.getElementById('totalMatches').textContent = this.matches.length;
        document.getElementById('liveMatches').textContent = this.matches.filter(m => m.status === 'live').length;
        document.getElementById('upcomingMatches').textContent = this.matches.filter(m => m.status === 'upcoming').length;
      },

      getFilteredMatches() {
        return this.matches.filter(m => {
          const matchesFilter = this.filter === 'all' || m.status === this.filter;
          const matchesSearch = !this.search || 
            [m.title, m.teams, m.league, m.sport].join(' ').toLowerCase().includes(this.search);
          return matchesFilter && matchesSearch;
        });
      },

      render() {
        const filtered = this.getFilteredMatches();
        const container = document.getElementById('matchesContainer');

        if (filtered.length === 0) {
          container.innerHTML = '<div class="empty-state">No matches found</div>';
          return;
        }

        container.innerHTML = filtered.map(match => `
          <div class="match-card ${this.selectedMatch && this.selectedMatch.match_id === match.match_id ? 'selected' : ''}" 
               data-match-id="${match.match_id}">
            <div class="match-title">${match.title}</div>
            <div class="match-info">${match.teams}</div>
            <div class="match-badges">
              <span class="badge ${match.status}">${match.status.toUpperCase()}</span>
              <span class="badge">${match.sport}</span>
            </div>
            <div class="match-info">${match.league}</div>
            <div class="match-viewers">👥 ${match.viewers} watching</div>
            <button class="watch-btn">Watch Now</button>
          </div>
        `).join('');

        // Touch/click to play
        container.querySelectorAll('.match-card').forEach(card => {
          const touchHandler = (e) => {
            e.stopPropagation();
            const match = this.matches.find(m => m.match_id === card.dataset.matchId);
            if (match) this.selectMatch(match);
          };

          card.addEventListener('click', touchHandler);
          card.addEventListener('touchstart', touchHandler);
          card.addEventListener('touchend', (e) => e.preventDefault());
        });
      },

      selectMatch(match) {
        this.selectedMatch = match;
        this.selectedSourceIndex = 0;
        this.selectedQuality = 'auto';
        this.render();
        this.renderSources();
        this.renderQualities();
        this.playSelected();
      },

      renderQualities() {
        if (!this.selectedMatch || !this.selectedMatch.server_urls) {
          document.getElementById('qualitySelector').style.display = 'none';
          return;
        }

        const qualities = ['auto', '360p', '720p', '1080p'];
        document.getElementById('qualitySelector').style.display = 'block';
        document.getElementById('qualityButtons').innerHTML = qualities.map(q => `
          <button class="quality-btn ${q === this.selectedQuality ? 'active' : ''}" data-quality="${q}">
            ${q.toUpperCase()}
          </button>
        `).join('');

        document.querySelectorAll('[data-quality]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.selectedQuality = btn.dataset.quality;
            this.renderQualities();
            this.playSelected();
          });
        });
      },

      renderSources() {
        if (!this.selectedMatch || !this.selectedMatch.server_urls || !this.selectedMatch.server_urls.length) {
          document.getElementById('sourceList').style.display = 'none';
          return;
        }

        const sources = this.selectedMatch.server_urls.filter(s => s && typeof s === 'string');
        document.getElementById('sourceList').style.display = 'block';
        document.getElementById('sourceItems').innerHTML = sources.map((url, idx) => `
          <button class="source-btn ${idx === this.selectedSourceIndex ? 'active' : ''}" 
                  data-index="${idx}">
            ${url.includes('.m3u8') ? 'HLS' : 'Stream'} ${idx + 1}
          </button>
        `).join('');

        document.querySelectorAll('[data-index]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.selectedSourceIndex = parseInt(btn.dataset.index);
            this.renderSources();
            this.playSelected();
          });
        });
      },

      playSelected() {
        if (!this.selectedMatch || !this.selectedMatch.server_urls) return;

        const sources = this.selectedMatch.server_urls.filter(s => s && typeof s === 'string');
        if (!sources.length) return;

        let url = sources[this.selectedSourceIndex] || sources[0];

        // Add quality parameter if needed (for some services)
        if (this.selectedQuality !== 'auto' && url.includes('.m3u8')) {
          url = url + (url.includes('?') ? '&' : '?') + 'quality=' + this.selectedQuality;
        }

        this.playStream(url);
      },

      playStream(url) {
        if (!url) return;

        this.stopStream();

        if (url.includes('.m3u8')) {
          if (window.Hls && Hls.isSupported()) {
            this.hls = new Hls({
              enableWorker: true,
              maxMaxBufferLength: 30,
              maxBufferLength: 10,
              maxBufferSize: 60 * 1000 * 1000
            });

            this.hls.loadSource(url);
            this.hls.attachMedia(this.videoPlayer);

            this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
              if (this.selectedQuality !== 'auto') {
                const levels = this.hls.levels;
                const level = levels.find(l => {
                  const quality = this.selectedQuality;
                  if (quality === '1080p') return l.height >= 1080;
                  if (quality === '720p') return l.height >= 720 && l.height < 1080;
                  if (quality === '360p') return l.height <= 360;
                  return true;
                });
                if (level) {
                  this.hls.currentLevel = levels.indexOf(level);
                }
              }
              this.videoPlayer.play().catch(() => {});
            });

            this.hls.on(Hls.Events.ERROR, (event, data) => {
              console.warn('HLS Error:', data);
            });
            return;
          }
        }

        this.videoPlayer.src = url;
        this.videoPlayer.load();
        this.videoPlayer.play().catch(() => {});
      },

      stopStream() {
        if (this.hls) {
          this.hls.destroy();
          this.hls = null;
        }
        if (this.videoPlayer && !this.videoPlayer.paused) {
          this.videoPlayer.pause();
        }
      },

      startRealTimeSync() {
        setInterval(() => this.loadMatches(), this.syncInterval);
      },

      showError(message) {
        const container = document.getElementById('errorContainer');
        container.innerHTML = `<div class="error">${message}</div>`;
      },

      clearError() {
        document.getElementById('errorContainer').innerHTML = '';
      }
    };

    document.addEventListener('DOMContentLoaded', () => app.init());
    window.addEventListener('beforeunload', () => app.stopStream());
  </script>
</body>
</html>
